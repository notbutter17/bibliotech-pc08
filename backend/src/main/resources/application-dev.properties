# Perfil dev: PostgreSQL local. La contraseña se toma de la variable DB_PASSWORD (nunca en el repositorio).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bibliotech_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
logging.level.upeu.bibliotech_v2=DEBUG
