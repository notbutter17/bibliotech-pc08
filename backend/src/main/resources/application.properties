spring.application.name=bibliotech_v2
# Perfil por defecto en local: dev. En contenedores y en la nube se usa SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Orígenes permitidos para CORS (en prod el frontend usa el proxy /api de nginx: mismo origen)
bibliotech.cors.origins=${CORS_ORIGINS:http://localhost:4200}
