# Perfil prod: Docker Compose y Render. Todas las credenciales llegan por variables de entorno
# (archivo .env local o variables/secretos de la plataforma). Sin valores por defecto: si falta una, no arranca.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.show-sql=false
server.error.include-stacktrace=never
logging.level.root=INFO
